services:
  db:
    image: dh-mirror.gitverse.ru/library/postgres:16-alpine
    container_name: shareit-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=shareit
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    command: postgres -c synchronous_commit=off -c fsync=off
    volumes:
      - shareit_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shareit"]
      interval: 5s
      timeout: 5s
      retries: 5

  gateway:
    build: .
    container_name: shareit-app
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=db
      - TZ=Europe/Moscow
    depends_on:
      db:
        condition: service_healthy

volumes:
  shareit_db_data:
